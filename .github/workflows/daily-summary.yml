name: Daily Horizon Summary

on:
  schedule:
    # 北京时间 21:00 = UTC 13:00（GitHub Actions 使用 UTC）
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: '抓取时间窗口（小时）。测试时可填较小值（如 3）以省 LLM 额度'
        required: false
        default: '24'

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 提交生成的简报到仓库

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Prepare subscribers (收件人=发件箱，不落库)
        run: printf '["%s"]\n' "${{ secrets.EMAIL_ADDRESS }}" > data/subscribers.json

      - name: Run Horizon
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
        run: uv run horizon --hours ${{ github.event.inputs.hours || '24' }}

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # 保留 gh-pages 上已有的历史简报
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
